name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".github/**/*.md", ".claude/**/*.md", ".agents/**/*.md"]
  pull_request:
    paths-ignore: ["README.md", "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".github/**/*.md", ".claude/**/*.md", ".agents/**/*.md"]

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ci-secret-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${archive}"
          curl -fsSLO "${base_url}/${checksums}"
          grep " ${archive}\$" "${checksums}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" "${checksums}" gitleaks
      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            gitleaks git --no-banner --redact --log-opts="-m ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            gitleaks git --no-banner --redact --log-opts="-m --all --full-history --diff-filter=tuxdb"
          fi
