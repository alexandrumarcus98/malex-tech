language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!public/og-image.png"
  path_instructions:
    - path: "src/**"
      instructions: |
        Check Astro 6 components, Tailwind v4 dark/light theme parity, accessibility, and responsive layout.
        Ensure no private infrastructure details, internal IPs, or secrets are included in public content.
    - path: "public/_headers"
      instructions: |
        Verify security headers and caching directives remain valid for Cloudflare Workers Static Assets.
